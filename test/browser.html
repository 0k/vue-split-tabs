<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dist/style.css">
  <script type="importmap">{ "imports": { "vue": "/vue.js" } }</script>
  <style>
    html, body { margin: 0; }
    #host { width: 600px; height: 400px; }
    #external-row { position: fixed; left: 650px; top: 80px; }
  </style>
</head>
<body>
<div id="host"></div>
<button id="external-row" type="button">External item</button>
<script type="module">
  import { createApp, defineComponent, h, ref } from "vue";
  import { createSplitTabsController, SplitTabs, SplitTabStrip, SplitTabsKeep, useSplitTabsPick } from "/dist/index.js";

  const PickProbe = defineComponent({ setup() {
    window.pick = useSplitTabsPick();
    return () => null;
  } });

  const count = Number(new URLSearchParams(location.search).get("n") || 12);
  window.resizeLog = [];
  const NativeResizeObserver = window.ResizeObserver;
  window.ResizeObserver = class extends NativeResizeObserver {
    constructor(callback) {
      super((entries, observer) => {
        window.resizeLog.push(entries.map(entry => [entry.contentRect.width, entry.contentRect.height]));
        callback(entries, observer);
      });
      window.resizeLog.push("constructed");
    }
    observe(element, options) {
      window.resizeLog.push(["observe", element.className]);
      super.observe(element, options);
    }
  };
  const tabs = ref(Array.from({ length: count }, (_, i) => `tab-${String.fromCharCode(97 + i)}`));
  const active = ref(tabs.value[0]);
  const optional = ref([]);
  const end = ref(false);
  const splitButtons = ref(true);
  window.fixture = { optional, end, splitButtons };
  const labels = { rows: "Rows", cols: "Cols", sendToOther: "Move", close: "Close tab" };
  const controller = createSplitTabsController({
    tabs, optional, active: { get: () => active.value, set: id => { active.value = id; } },
    entryKey: "browser-fixture", storageKey: "browser-layouts",
    minPaneWidth: 100, minPaneHeight: 80,
  });
  window.controller = controller;
  const view = ref(null);
  let externalCount = 0;
  document.querySelector("#external-row").addEventListener("pointerdown", down => {
    if (down.button !== 0) return;
    const id = `external-${++externalCount}`;
    function stop() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", stop);
      window.removeEventListener("pointercancel", stop);
    }
    function move(event) {
      if (event.pointerId !== down.pointerId || Math.hypot(event.clientX - down.clientX, event.clientY - down.clientY) <= 6) return;
      stop();
      view.value.startExternalDrag(event, id, { label: "External item" }, labels, () => {
        optional.value.push(id);
        tabs.value.push(id);
      });
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", stop);
    window.addEventListener("pointercancel", stop);
  });
  window.pointerLog = [];
  window.sawGhost = false;
  new MutationObserver(records => {
    if (records.some(record => [...record.addedNodes].some(node =>
      node instanceof Element && node.classList.contains("split-tabs-drag-ghost")))) window.sawGhost = true;
  }).observe(document.body, { childList: true, subtree: true });
  for (const type of ["pointerdown", "pointerup", "pointercancel"]) {
    window.addEventListener(type, event => window.pointerLog.push(`${type}:${event.pointerType}`), true);
  }
  createApp({
    render: () => h(SplitTabs, {
      ref: view, controller, labels: { divider: "Resize" },
      stripLabels: labels,
    }, {
      ...(end.value ? { pane: ({ pane }) => h(SplitTabStrip, {
        controller, pane: pane.id, labels, alwaysShow: true, splitButtons: splitButtons.value,
      }, {
        end: () => h("button", { type: "button", onClick: () => controller.open("tab-l", pane.id) }, "Add tab"),
      }) } : {}),
      keep: () => [h(PickProbe), ...tabs.value.map(tab => h(SplitTabsKeep, { key: tab, tab, part: "body" },
        () => h("div", { class: "content", style: "height:100%" }, `${tab} content`)))],
    }),
  }).mount("#host");
</script>
</body>
</html>
